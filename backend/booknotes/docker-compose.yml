version: '3.8'
services:
  db:
    image: postgres13
    container_name: booknotes
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=31415926535
      - POSTGRES_DB=tds_db
    volumes:
      -posgres_data:/var/lib/postgres/data
    ports:
      -"5432:5432"
  web:
    build: .
    container_name: web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/usr/src/app
    ports:
      -"8000:8000"
    depends_on:
      - db
  volumes:
    -pg_db_data: null
