
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="autorizationStyle.css">
    <title>BookReader Регистрация</title>
</head>
<body>
    <div class="background">
        <div class="login-container">
            <h1>Добро пожаловать на BookReader!</h1>
            <p>Чтобы пользоваться функциями сайта, зарегистрируйтесь</p>
            <form id="registration-form">
                <label for="login">Логин</label>
                <input type="text" id="username" placeholder="Введите логин" required>

                <label for="email">Электронная почта</label>
                <input type="email" id="email" placeholder="Введите электронную почту">

                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">  
            </form>
            <button type="submit" id="registerButton">Зарегистрироваться</button>
            <p>Уже есть аккаунт? <a href="signIn.html">Войти</a></p>
        </div>
    </div>
    <script src="reg.js"></script>
</body>
</html>
