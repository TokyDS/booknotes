{%extends 'signIn.html'%}
{%load static%}
{%block content%}
<div class="background">
    <div class="login-container">
        <h1>Добро пожаловать на BookReader!</h1>
        <p>Чтобы пользоваться функциями сайта, зарегистрируйтесь</p>
        <form id="registration-form">
            <label for="login">Логин</label>
            <input type="text" id="username" placeholder="Введите логин" required>

            <label for="email">Электронная почта</label>
            <input type="email" id="email" placeholder="Введите электронную почту">

            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль">  
        </form>
        <button type="submit" id="registerButton">Зарегистрироваться</button>
        <p>Уже есть аккаунт? <a href="login">Войти</a></p>
    </div>
</div>
<script src="{%static 'js/reg.js'%}"></script>
{%endblock%}
